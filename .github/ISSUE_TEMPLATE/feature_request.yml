# GHOST FIVE // VECTIS
# GitHub issue template for structured VECTIS project feedback.
name: Feature request
description: Propose a focused addition to the VECTIS language or toolchain.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or contract gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe the desired user-visible behavior.
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism and security
      description: Explain any impact on execution order, capabilities, adapters, or authority.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      render: text
